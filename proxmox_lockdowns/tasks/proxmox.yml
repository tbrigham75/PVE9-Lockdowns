---
- name: Gather service state for KSM
  ansible.builtin.service_facts:
  when: proxmox_lockdowns_ksm_policy == 'disable'

- name: Disable KSM tuning service if present
  ansible.builtin.systemd_service:
    name: ksmtuned.service
    enabled: false
    state: stopped
  when:
    - proxmox_lockdowns_ksm_policy == 'disable'
    - "'ksmtuned.service' in ansible_facts.services"

- name: Disable KSM service if present
  ansible.builtin.systemd_service:
    name: ksm.service
    enabled: false
    state: stopped
  when:
    - proxmox_lockdowns_ksm_policy == 'disable'
    - "'ksm.service' in ansible_facts.services"

- name: Read current KSM run state
  ansible.builtin.command: cat /sys/kernel/mm/ksm/run
  register: proxmox_lockdowns_ksm_run
  changed_when: false
  failed_when: false
  check_mode: false
  when: proxmox_lockdowns_ksm_policy == 'disable'

- name: Stop and unmerge KSM pages
  ansible.builtin.shell: "set -o pipefail && printf '2' > /sys/kernel/mm/ksm/run && printf '0' > /sys/kernel/mm/ksm/run"
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - proxmox_lockdowns_ksm_policy == 'disable'
    - proxmox_lockdowns_ksm_run.rc == 0
    - proxmox_lockdowns_ksm_run.stdout != '0'
    - not ansible_check_mode

- name: Query existing QEMU guests
  ansible.builtin.command: qm list --output-format json
  register: proxmox_lockdowns_qm_list
  changed_when: false
  check_mode: false
  when: proxmox_lockdowns_disable_ksm_for_existing_vms | bool

- name: Query existing VM KSM settings
  ansible.builtin.command: "qm config {{ item.vmid }} --current --output-format json"
  loop: "{{ proxmox_lockdowns_qm_list.stdout | from_json }}"
  register: proxmox_lockdowns_qm_configs
  changed_when: false
  check_mode: false
  when: proxmox_lockdowns_disable_ksm_for_existing_vms | bool

- name: Disable Allow KSM on existing QEMU guests
  ansible.builtin.command: "qm set {{ item.item.vmid }} --allow-ksm 0"
  loop: "{{ proxmox_lockdowns_qm_configs.results | default([]) }}"
  when:
    - proxmox_lockdowns_disable_ksm_for_existing_vms | bool
    - (item.stdout | from_json).get('allow-ksm', 1) | int != 0

- name: Read Corosync security authentication state
  ansible.builtin.command: grep -E '^\\s*secauth\s*:\s*on\\s*$' /etc/pve/corosync.conf
  register: proxmox_lockdowns_corosync_secauth
  changed_when: false
  failed_when: false
  check_mode: false
  when: proxmox_lockdowns_is_clustered | bool

- name: Report unsafe Corosync security state without mutation
  ansible.builtin.assert:
    that:
      - proxmox_lockdowns_corosync_secauth.rc == 0
    fail_msg: >-
      Corosync secauth:on was not found. This role will not edit pmxcfs or restart Corosync;
      remediate one node at a time under an approved cluster procedure.
  when:
    - proxmox_lockdowns_is_clustered | bool
    - proxmox_lockdowns_manage_corosync_secauth | bool
