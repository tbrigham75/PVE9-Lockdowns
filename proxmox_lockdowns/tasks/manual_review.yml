---
- name: Manual actions and operational controls from the source guide
  ansible.builtin.debug:
    msg:
      - 'Overview / Safe Remediation Workflow: inventory, impact review, lab test, pilot, monitor one business cycle, and roll out gradually.'
      - 'Overview / Installation Note and Pre-deployment Checklist: install Debian first for CIS partitioning; update firmware, BIOS, and BMC/IPMI/iDRAC/iLO.'
      - 'Overview / System Inventory, Hardening Level Selection, Design Principles: maintain inventory; select level; dedicate the host and separate traffic planes.'
      - '1.1.1 Apply Debian 13 CIS Level 1: apply the licensed benchmark with PVE deviations (keep fuse/Ceph modules; preserve clustered root SSH; skip CIS firewall when using PVE firewall).'
      - '1.1.2 Apply Debian 13 CIS Level 2: validate Ceph/ZFS/PBS; preserve cluster TCP forwarding through a scoped SSH Match block.'
      - '1.1.4 Apply ssh-audit Hardening Profile: select current Debian 13 server/client algorithms after compatibility testing; the guide delegates exact algorithms externally.'
      - '1.1.5 Enable Full-Disk Encryption: pre-install LUKS2 or planned ZFS native encryption; escrow recovery keys offline.'
      - '1.1.6 Dedicated Filesystem for /var/lib/vz: create/format/migrate/activate storage in a maintenance window; never use noexec.'
      - '1.2.1.1 Enable UEFI Secure Boot: firmware enrollment and boot-chain validation are physical/pre-boot actions.'
      - '1.2.2 Network Separation: design IPMI, management, cluster, storage, and tenant VLAN/NIC separation and MTU; no host IP on tenant bridges.'
      - '1.2.3 Maintain a Valid Proxmox Subscription: procurement and key upload are organizational; repository selection is opt-in.'
      - '1.2.5 PVE Firewall FORWARD DROP: model every guest flow and enable firewall per NIC/guest; this role cannot infer workload policy.'
      - '1.2.7 Avoid LXC/OCI and 1.2.8 Unprivileged Containers: choose VM isolation; review/migrate existing CTs and justify privileged CTs.'
      - '1.3.1-1.3.5 SDN: design zones/VNets, default-deny rules, DHCP/RA guard, VXLAN transport ACL/MTU, and authenticated EVPN/BGP policy.'
      - '1.3.6 Bridge & Kernel Settings: validate cross-VNet isolation and performance after the opt-in sysctl control.'
      - '2.1.1-2.1.5 Users: create named identities, map least privilege, perform human 2FA enrollment, custody/rotate break-glass, tier shell/sudo access, and review quarterly.'
      - '2.2.1-2.2.4 API Tokens: use service users, minimal paths/roles, vault storage, expirations, annual rotation, and quarterly ACL reviews; never root@pam tokens.'
      - '2.3.1-2.3.2 Certificates: CA/DNS ownership and ACME plugin credentials require operator governance; verify renewal per node.'
      - '3.1 Provide Redundant Corosync Links: provision independent NIC/switch/VLAN rings, restart one node at a time, test ring loss and quorum.'
      - '3.2 Secure Inter-Node Communication: audit secauth:on; any repair and restart is cluster-coordinated.'
      - '3.3-3.5 Ceph: design failure domains, simulate failures, encrypt OSDs at creation, and stage Messenger secure mode with compatibility and performance testing.'
      - '4.1-4.6 Backup & Disaster Recovery: enforce 3-2-1, daily guest backups, client-side encryption/key escrow, failure notifications, quarterly isolated restores, and record RTO/RPO.'
      - '5.1.1 Centralized Logging: provision a tamper-resistant collector and include pveproxy/API/sudo/PVE logs; forwarding is opt-in.'
      - '5.2.1-5.2.2 Monitoring: deploy a supported metrics stack and alert at CPU/disk/RAM >80% and Ceph health != HEALTH_OK.'
      - '5.3.1 System Audits: run OpenSCAP or equivalent quarterly and after major upgrades.'
      - '5.3.2 Rootkit Detection: rkhunter is unvalidated by the guide and remains opt-in; triage false positives.'
      - '5.4 Documentation and Exception Handling: update diagrams/inventory/change logs; record deviations, justification, risk acceptance, and approvals.'
      - 'Appendix C Recovery Drills: annual cold restore, quarterly file restore, Ceph OSD failure, Corosync ring failure, and runbook updates.'
      - 'Appendix D Host/Guest Checklists: complete firmware/network/partition/hardening/docs and guest model/VirtIO/agent/baseline/minimal-service/firewall checks.'
  tags: [manual]
