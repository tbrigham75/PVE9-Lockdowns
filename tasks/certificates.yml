---
- name: Validate certificate mode inputs
  ansible.builtin.assert:
    that:
      - proxmox_lockdowns_certificate_mode != 'none'
      - proxmox_lockdowns_certificate_mode != 'files' or
        (proxmox_lockdowns_certificate_fullchain_src | length > 0 and
         proxmox_lockdowns_certificate_private_key_src | length > 0)
      - proxmox_lockdowns_certificate_mode != 'acme' or
        (proxmox_lockdowns_acme_email | length > 0 and
         proxmox_lockdowns_acme_domain | length > 0)
    fail_msg: Certificate mode and its required source/account/domain inputs must be explicit.
  when: proxmox_lockdowns_apply_certificates | bool

- name: Stage supplied certificate chain
  ansible.builtin.copy:
    src: "{{ proxmox_lockdowns_certificate_fullchain_src }}"
    dest: /root/.proxmox-lockdowns-fullchain.pem
    owner: root
    group: root
    mode: '0600'
  when: proxmox_lockdowns_certificate_mode == 'files'
  register: proxmox_lockdowns_cert_chain

- name: Stage supplied private key
  ansible.builtin.copy:
    src: "{{ proxmox_lockdowns_certificate_private_key_src }}"
    dest: /root/.proxmox-lockdowns-privkey.pem
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: proxmox_lockdowns_certificate_mode == 'files'
  register: proxmox_lockdowns_cert_key

- name: Detect installed custom PVE proxy certificate
  ansible.builtin.stat:
    path: /etc/pve/local/pveproxy-ssl.pem
  register: proxmox_lockdowns_installed_custom_cert
  when: proxmox_lockdowns_certificate_mode == 'files'

- name: Install supplied PVE certificate after validation
  ansible.builtin.command:
    argv:
      - pvenode
      - cert
      - set
      - --certificates
      - /root/.proxmox-lockdowns-fullchain.pem
      - --key
      - /root/.proxmox-lockdowns-privkey.pem
      - --force
      - '1'
  when:
    - proxmox_lockdowns_certificate_mode == 'files'
    - not ansible_check_mode
    - >-
      proxmox_lockdowns_cert_chain.changed or proxmox_lockdowns_cert_key.changed or
      not proxmox_lockdowns_installed_custom_cert.stat.exists or
      (proxmox_lockdowns_cert_chain.checksum | default('')) !=
      (proxmox_lockdowns_installed_custom_cert.stat.checksum | default('missing'))
  notify: Reload pveproxy

- name: Query ACME accounts
  ansible.builtin.command: pvenode acme account list --output-format json
  register: proxmox_lockdowns_acme_accounts
  changed_when: false
  check_mode: false
  when: proxmox_lockdowns_certificate_mode == 'acme'

- name: Register ACME account
  ansible.builtin.command: >-
    pvenode acme account register {{ proxmox_lockdowns_acme_account }}
    {{ proxmox_lockdowns_acme_email }}
    {{ ('--directory ' ~ proxmox_lockdowns_acme_directory) if proxmox_lockdowns_acme_directory else '' }}
  when:
    - proxmox_lockdowns_certificate_mode == 'acme'
    - proxmox_lockdowns_acme_account not in proxmox_lockdowns_acme_accounts.stdout
    - not ansible_check_mode

- name: Query node ACME configuration
  ansible.builtin.command: pvenode config get --output-format json
  register: proxmox_lockdowns_node_config
  changed_when: false
  check_mode: false
  when: proxmox_lockdowns_certificate_mode == 'acme'

- name: Configure node ACME domain
  ansible.builtin.command:
    argv:
      - pvenode
      - config
      - set
      - --acme
      - "account={{ proxmox_lockdowns_acme_account }}"
      - --acmedomain0
      - "domain={{ proxmox_lockdowns_acme_domain }}{{ ',plugin=' ~ proxmox_lockdowns_acme_plugin if proxmox_lockdowns_acme_plugin else '' }}"
  when:
    - proxmox_lockdowns_certificate_mode == 'acme'
    - not ansible_check_mode
    - >-
      proxmox_lockdowns_acme_domain not in
      ((proxmox_lockdowns_node_config.stdout | from_json).acmedomain0 | default('')) or
      proxmox_lockdowns_acme_account not in
      ((proxmox_lockdowns_node_config.stdout | from_json).acme | default(''))
  changed_when: true
  register: proxmox_lockdowns_acme_node_config_change

- name: Detect installed ACME proxy certificate
  ansible.builtin.stat:
    path: /etc/pve/local/pveproxy-ssl.pem
  register: proxmox_lockdowns_acme_cert
  when: proxmox_lockdowns_certificate_mode == 'acme'

- name: Order ACME certificate
  ansible.builtin.command: pvenode acme cert order
  when:
    - proxmox_lockdowns_certificate_mode == 'acme'
    - not ansible_check_mode
    - >-
      (proxmox_lockdowns_acme_node_config_change.changed | default(false)) or
      not proxmox_lockdowns_acme_cert.stat.exists
  changed_when: true
  notify: Reload pveproxy
